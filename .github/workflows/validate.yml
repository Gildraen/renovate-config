name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.222.4 renovate-config-validator --strict --no-global default.json renovate.json
      - name: Test custom extraction
        run: node --test test/*.test.mjs