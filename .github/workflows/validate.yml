name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.222.4 renovate-config-validator --strict --no-global default.json renovate.json
      - name: Test custom extraction
        run: node --test test/*.test.mjs