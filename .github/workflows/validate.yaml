name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.222.4 renovate-config-validator --strict --no-global default.json renovate.json
      - name: Test custom extraction
        run: node --test test/*.test.mjs

  release:
    name: Open or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
      expected-sha: ${{ github.sha }}
      app-client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}